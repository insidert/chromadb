<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maarifaa Assistant</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chat-container {
    width: 420px;
    height: 600px;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat-header {
    background: linear-gradient(135deg, #1e3cff 0%, #6366f1 100%);
    color: white;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.chat-header .avatar {
    width: 42px;
    height: 42px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
}

.chat-header .info h3 {
    font-size: 16px;
    font-weight: 600;
}

.chat-header .info p {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 2px;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.messages::-webkit-scrollbar {
    width: 4px;
}

.messages::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 2px;
}

.message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user {
    background: #1e3cff;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}

.message.bot {
    background: #e2e8f0;
    color: #1e293b;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}

.message.bot .matched-faq {
    font-size: 11px;
    color: #64748b;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #cbd5e1;
}

.suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}

.suggestions button {
    background: white;
    border: 1px solid #cbd5e1;
    color: #1e3cff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
}

.suggestions button:hover {
    background: #1e3cff;
    color: white;
    border-color: #1e3cff;
}

.typing {
    background: #e2e8f0;
    color: #94a3b8;
    align-self: flex-start;
    padding: 16px 20px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    font-size: 14px;
    display: flex;
    gap: 4px;
    animation: fadeIn 0.3s ease;
}

.typing span {
    animation: blink 1.4s infinite both;
    width: 6px;
    height: 6px;
    background: #94a3b8;
    border-radius: 50%;
    display: inline-block;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
    0%, 80%, 100% { opacity: 0; }
    40% { opacity: 1; }
}

.input-area {
    padding: 16px 20px;
    background: white;
    border-top: 1px solid #e2e8f0;
    display: flex;
    gap: 8px;
}

.input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #e2e8f0;
    border-radius: 24px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
}

.input-area input:focus {
    border-color: #1e3cff;
}

.input-area button {
    width: 44px;
    height: 44px;
    background: #1e3cff;
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
}

.input-area button:hover {
    background: #4338ca;
}

.input-area button svg {
    width: 18px;
    height: 18px;
    fill: white;
}

.welcome {
    text-align: center;
    padding: 40px 20px;
    color: #94a3b8;
}

.welcome h2 {
    font-size: 20px;
    color: #1e293b;
    margin-bottom: 8px;
}

.welcome p {
    font-size: 14px;
    line-height: 1.6;
}

.welcome .quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
}

.welcome .quick-actions button {
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    color: #475569;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
}

.welcome .quick-actions button:hover {
    background: #1e3cff;
    color: white;
    border-color: #1e3cff;
}
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar">🤖</div>
        <div class="info">
            <h3>Maarifaa Assistant</h3>
            <p>Online — Ask me anything</p>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="welcome" id="welcome">
            <h2>👋 Hello!</h2>
            <p>I'm the Maarifaa assistant. I can help you with information about studying in India, courses, visas, scholarships, and more.</p>
            <div class="quick-actions">
                <button onclick="sendMessage('What is Maarifaa?')">What is Maarifaa?</button>
                <button onclick="sendMessage('Study in India')">Study in India</button>
                <button onclick="sendMessage('Scholarships')">Scholarships</button>
                <button onclick="sendMessage('Visa process')">Visa process</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input id="input" placeholder="Type your question..." autofocus>
        <button onclick="sendMessage()" id="sendBtn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const welcomeEl = document.getElementById('welcome');

function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(text, type) {
    welcomeEl.style.display = 'none';
    const div = document.createElement('div');
    div.className = `message ${type}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
}

function addBotResponse(answer, question, suggestions) {
    const div = document.createElement('div');
    div.className = 'message bot';

    let html = answer;

    if (question) {
        html += `<div class="matched-faq">📌 ${question}</div>`;
    }

    if (suggestions && suggestions.length) {
        html += '<div class="suggestions">';
        suggestions.forEach(q => {
            html += `<button onclick="sendMessage('${q.replace(/'/g, "\\'")}')">${q}</button>`;
        });
        html += '</div>';
    }

    div.innerHTML = html;
    messagesEl.appendChild(div);
    scrollToBottom();
}

function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    scrollToBottom();
}

function hideTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
}

async function sendMessage(text) {
    const message = text || inputEl.value.trim();
    if (!message) return;

    inputEl.value = '';
    addMessage(message, 'user');
    showTyping();

    try {
        const res = await fetch('http://127.0.0.1:8000/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: message })
        });

        if (!res.ok) throw new Error('Server error');

        const data = await res.json();
        hideTyping();
        addBotResponse(data.answer, data.corrected_question, data.suggestions);

    } catch (err) {
        hideTyping();
        const div = document.createElement('div');
        div.className = 'message bot';
        div.textContent = '⚠️ Unable to connect to the server. Make sure the backend is running on http://127.0.0.1:8000.';
        messagesEl.appendChild(div);
        scrollToBottom();
    }
}

inputEl.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
